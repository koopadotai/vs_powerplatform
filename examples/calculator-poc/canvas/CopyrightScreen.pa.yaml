Screens:
  CopyrightScreen:
    Properties:
      Fill: =ColorBg
    Children:
      - rectCopyrightHeader:
          Control: Rectangle
          Properties:
            Fill: =ColorPrimary
            Height: =HeaderH
            Width: =Parent.Width
      - btnBack:
          Control: Button
          Properties:
            BasePaletteColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            FontColor: =Color.White
            FontSize: =22
            Height: =44
            OnSelect: =Navigate(MainScreen, ScreenTransition.Fade)
            Text: ="←"
            Width: =44
            X: =GridPadX
            Y: =20
      - lblCopyrightTitle:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =Color.White
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =FsTitle
            Text: ="About"
            Width: =Parent.Width
            Y: =20
      - lblCopyrightVersion:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 0.7)
            Height: =14
            Size: =9
            Text: =AppVersion
            Width: =Parent.Width
            Y: =HeaderH - 18
      - rectWelcomeCard:
          Control: Rectangle
          Properties:
            Fill: =ColorCard
            Height: =200
            Width: =Parent.Width - (GridPadX * 2)
            X: =GridPadX
            Y: =HeaderH + 32
      - lblUserAvatar:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =Color.White
            Fill: =ColorPrimary
            FontWeight: =FontWeight.Bold
            Height: =96
            Size: =40
            Text: =Left(varCurrentUser.FullName, 1)
            Width: =96
            X: =(Parent.Width - 96) / 2
            Y: =HeaderH + 56
      - lblWelcomeBack:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =ColorTextDark
            FontWeight: =FontWeight.Bold
            Height: =26
            Size: =FsSubtitle
            Text: ="Welcome back, " & varCurrentUser.FullName
            Width: =Parent.Width - (GridPadX * 2) - 32
            X: =GridPadX + 16
            Y: =HeaderH + 168
      - lblAppNameLine:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =ColorTextGray
            Height: =22
            Size: =FsBody
            Text: |-
              ="You are using: " & AppName
            Width: =Parent.Width - (GridPadX * 2) - 32
            X: =GridPadX + 16
            Y: =HeaderH + 198
      - rectCopyrightCard:
          Control: Rectangle
          Properties:
            Fill: =ColorCard
            Height: =180
            Width: =Parent.Width - (GridPadX * 2)
            X: =GridPadX
            Y: =HeaderH + 252
      - lblCopyrightSymbol:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =ColorPrimary
            FontWeight: =FontWeight.Bold
            Height: =56
            Size: =48
            Text: ="©"
            Width: =Parent.Width
            Y: =HeaderH + 270
      - lblCopyrightLine:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =ColorTextDark
            FontWeight: =FontWeight.Bold
            Height: =28
            Size: =FsTitle
            Text: ="Copyright by WeeSiong"
            Width: =Parent.Width - (GridPadX * 2) - 32
            X: =GridPadX + 16
            Y: =HeaderH + 332
      - lblCopyrightYear:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =ColorTextGray
            Height: =22
            Size: =FsBody
            Text: ="© 2026 · All rights reserved"
            Width: =Parent.Width - (GridPadX * 2) - 32
            X: =GridPadX + 16
            Y: =HeaderH + 372
      - btnBackToCalc:
          Control: Button
          Properties:
            BasePaletteColor: =ColorPrimary
            BorderRadiusBottomLeft: =28
            BorderRadiusBottomRight: =28
            BorderRadiusTopLeft: =28
            BorderRadiusTopRight: =28
            BorderThickness: =0
            FontColor: =Color.White
            FontSize: =FsSubtitle
            FontWeight: =FontWeight.Bold
            Height: =56
            OnSelect: =Navigate(MainScreen, ScreenTransition.Fade)
            Text: ="Back to Calculator"
            Width: =Parent.Width - (GridPadX * 2)
            X: =GridPadX
            Y: =Parent.Height - 100
