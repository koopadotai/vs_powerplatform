Screens:
  MainScreen:
    Properties:
      Fill: =ColorBg
    Children:
      - rectHeader:
          Control: Rectangle
          Properties:
            Fill: =ColorPrimary
            Height: =HeaderH
            Width: =Parent.Width
      - lblTitle:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =Color.White
            FontWeight: =FontWeight.Bold
            Height: =40
            Size: =FsTitle
            Text: =AppName
            Width: =Parent.Width
            Y: =20
      - lblVersion:
          Control: Label
          Properties:
            Align: =Align.Center
            Color: =RGBA(255, 255, 255, 0.7)
            Height: =14
            Size: =9
            Text: =AppVersion
            Width: =Parent.Width
            Y: =HeaderH - 18
      - rectDisplay:
          Control: Rectangle
          Properties:
            Fill: =ColorCard
            Height: =DisplayH
            Width: =Parent.Width - (GridPadX * 2)
            X: =GridPadX
            Y: =DisplayY
      - lblDisplay:
          Control: Label
          Properties:
            Align: =Align.Right
            Color: =ColorTextDark
            FontWeight: =FontWeight.Bold
            Height: =DisplayH
            Size: =FsDisplay
            Text: =varDisplay
            Width: =Parent.Width - (GridPadX * 2) - 32
            X: =GridPadX + 16
            Y: =DisplayY
      - lblOperatorHint:
          Control: Label
          Properties:
            Color: =ColorPrimary
            FontWeight: =FontWeight.Bold
            Height: =22
            Size: =FsSubtitle
            Text: =varOperator
            Width: =60
            X: =GridPadX + 16
            Y: =DisplayY + 8
      - btnClear:
          Control: Button
          Properties:
            BasePaletteColor: =ColorClearBg
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorClearText
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, "0");
              Set(varStoredValue, 0);
              Set(varOperator, "");
              Set(varJustCalculated, false)
            Text: ="C"
            Width: =BtnW
            X: =GridPadX
            Y: =GridY
      - btnDivide:
          Control: Button
          Properties:
            BasePaletteColor: =ColorOperatorBg
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorOperator
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =If(varOperator <> "" And !varJustCalculated,
                Set(varStoredValue, IfError(
                  Switch(varOperator,
                    "+", varStoredValue + Value(varDisplay),
                    "-", varStoredValue - Value(varDisplay),
                    "*", varStoredValue * Value(varDisplay),
                    "/", varStoredValue / Value(varDisplay),
                    Value(varDisplay)),
                  0));
                Set(varDisplay, Text(varStoredValue)),
                Set(varStoredValue, Value(varDisplay))
              );
              Set(varOperator, "/");
              Set(varJustCalculated, true)
            Text: ="÷"
            Width: =BtnW
            X: =GridPadX + (BtnW + GridGap)
            Y: =GridY
      - btnMultiply:
          Control: Button
          Properties:
            BasePaletteColor: =ColorOperatorBg
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorOperator
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =If(varOperator <> "" And !varJustCalculated,
                Set(varStoredValue, IfError(
                  Switch(varOperator,
                    "+", varStoredValue + Value(varDisplay),
                    "-", varStoredValue - Value(varDisplay),
                    "*", varStoredValue * Value(varDisplay),
                    "/", varStoredValue / Value(varDisplay),
                    Value(varDisplay)),
                  0));
                Set(varDisplay, Text(varStoredValue)),
                Set(varStoredValue, Value(varDisplay))
              );
              Set(varOperator, "*");
              Set(varJustCalculated, true)
            Text: ="×"
            Width: =BtnW
            X: =GridPadX + 2 * (BtnW + GridGap)
            Y: =GridY
      - btnMinus:
          Control: Button
          Properties:
            BasePaletteColor: =ColorOperatorBg
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorOperator
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =If(varOperator <> "" And !varJustCalculated,
                Set(varStoredValue, IfError(
                  Switch(varOperator,
                    "+", varStoredValue + Value(varDisplay),
                    "-", varStoredValue - Value(varDisplay),
                    "*", varStoredValue * Value(varDisplay),
                    "/", varStoredValue / Value(varDisplay),
                    Value(varDisplay)),
                  0));
                Set(varDisplay, Text(varStoredValue)),
                Set(varStoredValue, Value(varDisplay))
              );
              Set(varOperator, "-");
              Set(varJustCalculated, true)
            Text: ="−"
            Width: =BtnW
            X: =GridPadX + 3 * (BtnW + GridGap)
            Y: =GridY
      - btn7:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "7", varDisplay & "7"));
              Set(varJustCalculated, false)
            Text: ="7"
            Width: =BtnW
            X: =GridPadX
            Y: =GridY + (BtnH + GridGap)
      - btn8:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "8", varDisplay & "8"));
              Set(varJustCalculated, false)
            Text: ="8"
            Width: =BtnW
            X: =GridPadX + (BtnW + GridGap)
            Y: =GridY + (BtnH + GridGap)
      - btn9:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "9", varDisplay & "9"));
              Set(varJustCalculated, false)
            Text: ="9"
            Width: =BtnW
            X: =GridPadX + 2 * (BtnW + GridGap)
            Y: =GridY + (BtnH + GridGap)
      - btnPlus:
          Control: Button
          Properties:
            BasePaletteColor: =ColorOperatorBg
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorOperator
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =If(varOperator <> "" And !varJustCalculated,
                Set(varStoredValue, IfError(
                  Switch(varOperator,
                    "+", varStoredValue + Value(varDisplay),
                    "-", varStoredValue - Value(varDisplay),
                    "*", varStoredValue * Value(varDisplay),
                    "/", varStoredValue / Value(varDisplay),
                    Value(varDisplay)),
                  0));
                Set(varDisplay, Text(varStoredValue)),
                Set(varStoredValue, Value(varDisplay))
              );
              Set(varOperator, "+");
              Set(varJustCalculated, true)
            Text: ="+"
            Width: =BtnW
            X: =GridPadX + 3 * (BtnW + GridGap)
            Y: =GridY + (BtnH + GridGap)
      - btn4:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "4", varDisplay & "4"));
              Set(varJustCalculated, false)
            Text: ="4"
            Width: =BtnW
            X: =GridPadX
            Y: =GridY + 2 * (BtnH + GridGap)
      - btn5:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "5", varDisplay & "5"));
              Set(varJustCalculated, false)
            Text: ="5"
            Width: =BtnW
            X: =GridPadX + (BtnW + GridGap)
            Y: =GridY + 2 * (BtnH + GridGap)
      - btn6:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "6", varDisplay & "6"));
              Set(varJustCalculated, false)
            Text: ="6"
            Width: =BtnW
            X: =GridPadX + 2 * (BtnW + GridGap)
            Y: =GridY + 2 * (BtnH + GridGap)
      - btnDot:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay,
                If(varJustCalculated, "0.",
                  If(Find(".", varDisplay) = 0,
                    varDisplay & ".",
                    varDisplay)));
              Set(varJustCalculated, false)
            Text: ="."
            Width: =BtnW
            X: =GridPadX + 3 * (BtnW + GridGap)
            Y: =GridY + 2 * (BtnH + GridGap)
      - btn1:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "1", varDisplay & "1"));
              Set(varJustCalculated, false)
            Text: ="1"
            Width: =BtnW
            X: =GridPadX
            Y: =GridY + 3 * (BtnH + GridGap)
      - btn2:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "2", varDisplay & "2"));
              Set(varJustCalculated, false)
            Text: ="2"
            Width: =BtnW
            X: =GridPadX + (BtnW + GridGap)
            Y: =GridY + 3 * (BtnH + GridGap)
      - btn3:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated Or varDisplay = "0", "3", varDisplay & "3"));
              Set(varJustCalculated, false)
            Text: ="3"
            Width: =BtnW
            X: =GridPadX + 2 * (BtnW + GridGap)
            Y: =GridY + 3 * (BtnH + GridGap)
      - btnEquals:
          Control: Button
          Properties:
            BasePaletteColor: =ColorEqualsBg
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorEqualsText
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varStoredValue, IfError(
                Switch(varOperator,
                  "+", varStoredValue + Value(varDisplay),
                  "-", varStoredValue - Value(varDisplay),
                  "*", varStoredValue * Value(varDisplay),
                  "/", varStoredValue / Value(varDisplay),
                  Value(varDisplay)),
                Notify("Math error", NotificationType.Error); 0));
              Set(varDisplay, Text(varStoredValue));
              Set(varOperator, "");
              Set(varJustCalculated, true)
            Text: ="="
            Width: =BtnW
            X: =GridPadX + 3 * (BtnW + GridGap)
            Y: =GridY + 3 * (BtnH + GridGap)
      - btn0:
          Control: Button
          Properties:
            BasePaletteColor: =ColorCard
            BorderRadiusBottomLeft: =16
            BorderRadiusBottomRight: =16
            BorderRadiusTopLeft: =16
            BorderRadiusTopRight: =16
            BorderThickness: =0
            FontColor: =ColorTextDark
            FontSize: =FsButton
            FontWeight: =FontWeight.Bold
            Height: =BtnH
            OnSelect: |-
              =Set(varDisplay, If(varJustCalculated, "0", If(varDisplay = "0", "0", varDisplay & "0")));
              Set(varJustCalculated, false)
            Text: ="0"
            Width: =Parent.Width - (GridPadX * 2)
            X: =GridPadX
            Y: =GridY + 4 * (BtnH + GridGap)
      - btnCopyright:
          Control: Button
          Properties:
            BasePaletteColor: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            FontColor: =ColorTextGray
            FontSize: =FsBody
            FontWeight: =FontWeight.Bold
            Height: =28
            OnSelect: =Navigate(CopyrightScreen, ScreenTransition.Fade)
            Text: ="© Copyright by WeeSiong"
            Width: =Parent.Width
            Y: =Parent.Height - 36
