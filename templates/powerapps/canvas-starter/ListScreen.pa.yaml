Screens:
  ListScreen:
    Properties:
      Fill: =ColorBg
    Children:

      # ── HEADER ─────────────────────────────────────────────────
      - rectHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =HeaderH
            Fill: =ColorPrimary

      - btnBack:
          Control: Button
          Properties:
            X: =SpMedium
            Y: =SpMedium + 4
            Width: =44
            Height: =44
            Text: ="←"
            FontColor: =Color.White
            FontSize: =22
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

      - lblListTitle:
          Control: Label
          Properties:
            X: =0
            Y: =20
            Width: =Parent.Width
            Height: =40
            Text: ="Items"
            Color: =Color.White
            Size: =FsTitle
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      # ── SEARCH ──────────────────────────────────────────────────
      - txtSearch:
          Control: TextInput
          Properties:
            X: =SpMedium
            Y: =HeaderH + SpMedium
            Width: =Parent.Width - (SpMedium * 2)
            Height: =44
            HintText: ="Search..."
            Default: =""
            Fill: =ColorCard
            BorderColor: =ColorBorder
            BorderThickness: =1
            FontSize: =FsBody
            Color: =ColorTextDark

      # ── EMPTY STATE ─────────────────────────────────────────────
      - lblEmptyState:
          Control: Label
          Properties:
            X: =SpMedium
            Y: =HeaderH + 80 + 60
            Width: =Parent.Width - (SpMedium * 2)
            Height: =80
            Text: ="No items yet." & Char(10) & "Tap the + button to add your first one."
            Color: =ColorTextGray
            Size: =FsBody
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            Visible: =true

      # ── ADD BUTTON (FAB) ────────────────────────────────────────
      - btnAdd:
          Control: Button
          Properties:
            X: =Parent.Width - 72 - SpMedium
            Y: =Parent.Height - NavBarH - 72 - SpMedium
            Width: =56
            Height: =56
            Text: ="+"
            FontColor: =Color.White
            FontSize: =28
            FontWeight: =FontWeight.Bold
            Fill: =ColorPrimary
            BorderThickness: =0
            BorderRadiusTopLeft: =28
            BorderRadiusTopRight: =28
            BorderRadiusBottomLeft: =28
            BorderRadiusBottomRight: =28
            OnSelect: =Notify("Add item — wire this to your data source", NotificationType.Information)

      # ── BOTTOM NAVIGATION ───────────────────────────────────────
      - rectNavBg:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width
            Height: =NavBarH
            Fill: =ColorCard

      - btnNavHome:
          Control: Button
          Properties:
            X: =0
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="🏠" & Char(10) & "Home"
            FontColor: =ColorTextGray
            FontSize: =FsCaption
            Fill: =ColorCard
            BorderThickness: =0
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

      - btnNavList:
          Control: Button
          Properties:
            X: =Parent.Width / 3
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="📋" & Char(10) & "List"
            FontColor: =ColorPrimary
            FontSize: =FsCaption
            FontWeight: =FontWeight.Semibold
            Fill: =ColorCard
            BorderThickness: =0

      - btnNavProfile:
          Control: Button
          Properties:
            X: =(Parent.Width / 3) * 2
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="👤" & Char(10) & "Profile"
            FontColor: =ColorTextGray
            FontSize: =FsCaption
            Fill: =ColorCard
            BorderThickness: =0
            OnSelect: =Navigate(ProfileScreen, ScreenTransition.Fade)
