Screens:
  HomeScreen:
    Properties:
      Fill: =ColorBg
    Children:

      # ── HEADER ─────────────────────────────────────────────────
      - rectHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =HeaderH
            Fill: =ColorPrimary

      - lblTitle:
          Control: Label
          Properties:
            X: =0
            Y: =20
            Width: =Parent.Width
            Height: =40
            Text: ="__APP_TITLE__"
            Color: =Color.White
            Size: =FsTitle
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      - lblVersion:
          Control: Label
          Properties:
            X: =0
            Y: =HeaderH - 18
            Width: =Parent.Width
            Height: =14
            Text: =AppVersion
            Color: =RGBA(255, 255, 255, 0.7)
            Size: =9
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      # ── WELCOME CARD ────────────────────────────────────────────
      - rectWelcomeCard:
          Control: Rectangle
          Properties:
            X: =SpMedium
            Y: =HeaderH + SpMedium
            Width: =Parent.Width - (SpMedium * 2)
            Height: =140
            Fill: =ColorCard

      - lblWelcomeGreeting:
          Control: Label
          Properties:
            X: =SpMedium + SpMedium
            Y: =HeaderH + SpMedium + SpMedium
            Width: =Parent.Width - (SpMedium * 4)
            Height: =28
            Text: ="Welcome, " & varCurrentUser.FullName & "!"
            Color: =ColorTextDark
            Size: =FsSubtitle
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      - lblWelcomeSub:
          Control: Label
          Properties:
            X: =SpMedium + SpMedium
            Y: =HeaderH + SpMedium + SpMedium + 32
            Width: =Parent.Width - (SpMedium * 4)
            Height: =22
            Text: ="__APP_TAGLINE__"
            Color: =ColorTextGray
            Size: =FsBody
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      - lblWelcomeDate:
          Control: Label
          Properties:
            X: =SpMedium + SpMedium
            Y: =HeaderH + SpMedium + 95
            Width: =Parent.Width - (SpMedium * 4)
            Height: =22
            Text: =FmtDate(Today())
            Color: =ColorTextMid
            Size: =FsCaption
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      # ── PRIMARY ACTION ──────────────────────────────────────────
      - btnPrimaryAction:
          Control: Button
          Properties:
            X: =SpMedium
            Y: =HeaderH + SpMedium + 160
            Width: =Parent.Width - (SpMedium * 2)
            Height: =56
            Text: ="Get Started"
            FontColor: =Color.White
            FontSize: =FsSubtitle
            FontWeight: =FontWeight.Semibold
            Fill: =ColorPrimary
            BorderThickness: =0
            BorderRadiusTopLeft: =28
            BorderRadiusTopRight: =28
            BorderRadiusBottomLeft: =28
            BorderRadiusBottomRight: =28
            OnSelect: =Notify("Welcome aboard!", NotificationType.Success)

      # ── BOTTOM NAVIGATION ───────────────────────────────────────
      - rectNavBg:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width
            Height: =NavBarH
            Fill: =ColorCard

      - btnNavHome:
          Control: Button
          Properties:
            X: =0
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="🏠" & Char(10) & "Home"
            FontColor: =ColorPrimary
            FontSize: =FsCaption
            FontWeight: =FontWeight.Semibold
            Fill: =ColorCard
            BorderThickness: =0

      - btnNavList:
          Control: Button
          Properties:
            X: =Parent.Width / 3
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="📋" & Char(10) & "List"
            FontColor: =ColorTextGray
            FontSize: =FsCaption
            Fill: =ColorCard
            BorderThickness: =0
            OnSelect: =Navigate(ListScreen, ScreenTransition.Fade)

      - btnNavProfile:
          Control: Button
          Properties:
            X: =(Parent.Width / 3) * 2
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="👤" & Char(10) & "Profile"
            FontColor: =ColorTextGray
            FontSize: =FsCaption
            Fill: =ColorCard
            BorderThickness: =0
            OnSelect: =Navigate(ProfileScreen, ScreenTransition.Fade)
