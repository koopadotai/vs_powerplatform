Screens:
  ProfileScreen:
    Properties:
      Fill: =ColorBg
    Children:

      # ── HEADER ─────────────────────────────────────────────────
      - rectHeader:
          Control: Rectangle
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =HeaderH
            Fill: =ColorPrimary

      - btnBack:
          Control: Button
          Properties:
            X: =SpMedium
            Y: =SpMedium + 4
            Width: =44
            Height: =44
            Text: ="←"
            FontColor: =Color.White
            FontSize: =22
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

      - lblProfileTitle:
          Control: Label
          Properties:
            X: =0
            Y: =20
            Width: =Parent.Width
            Height: =40
            Text: ="Profile"
            Color: =Color.White
            Size: =FsTitle
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      # ── USER CARD ───────────────────────────────────────────────
      - rectUserCard:
          Control: Rectangle
          Properties:
            X: =SpMedium
            Y: =HeaderH + SpMedium
            Width: =Parent.Width - (SpMedium * 2)
            Height: =180
            Fill: =ColorCard

      - lblUserInitial:
          Control: Label
          Properties:
            X: =(Parent.Width - 80) / 2
            Y: =HeaderH + SpMedium + SpMedium
            Width: =80
            Height: =80
            Text: =Left(varCurrentUser.FullName, 1)
            Color: =Color.White
            Size: =32
            FontWeight: =FontWeight.Bold
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Fill: =ColorPrimary
            BorderThickness: =0

      - lblUserName:
          Control: Label
          Properties:
            X: =SpMedium + SpMedium
            Y: =HeaderH + SpMedium + 105
            Width: =Parent.Width - (SpMedium * 4)
            Height: =26
            Text: =varCurrentUser.FullName
            Color: =ColorTextDark
            Size: =FsSubtitle
            FontWeight: =FontWeight.Semibold
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      - lblUserEmail:
          Control: Label
          Properties:
            X: =SpMedium + SpMedium
            Y: =HeaderH + SpMedium + 134
            Width: =Parent.Width - (SpMedium * 4)
            Height: =22
            Text: =varCurrentUser.Email
            Color: =ColorTextGray
            Size: =FsBody
            Align: =Align.Center
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      # ── ABOUT SECTION ───────────────────────────────────────────
      - lblAboutLabel:
          Control: Label
          Properties:
            X: =SpMedium
            Y: =HeaderH + SpMedium + 200
            Width: =Parent.Width - (SpMedium * 2)
            Height: =22
            Text: ="ABOUT"
            Color: =ColorTextGray
            Size: =FsCaption
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      - rectAboutCard:
          Control: Rectangle
          Properties:
            X: =SpMedium
            Y: =HeaderH + SpMedium + 226
            Width: =Parent.Width - (SpMedium * 2)
            Height: =56
            Fill: =ColorCard

      - lblAboutVersion:
          Control: Label
          Properties:
            X: =SpMedium + SpMedium
            Y: =HeaderH + SpMedium + 240
            Width: =Parent.Width - (SpMedium * 4)
            Height: =28
            Text: ="App version: " & AppVersion
            Color: =ColorTextDark
            Size: =FsBody
            Fill: =RGBA(0, 0, 0, 0)
            BorderThickness: =0

      # ── BOTTOM NAVIGATION ───────────────────────────────────────
      - rectNavBg:
          Control: Rectangle
          Properties:
            X: =0
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width
            Height: =NavBarH
            Fill: =ColorCard

      - btnNavHome:
          Control: Button
          Properties:
            X: =0
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="🏠" & Char(10) & "Home"
            FontColor: =ColorTextGray
            FontSize: =FsCaption
            Fill: =ColorCard
            BorderThickness: =0
            OnSelect: =Navigate(HomeScreen, ScreenTransition.Fade)

      - btnNavList:
          Control: Button
          Properties:
            X: =Parent.Width / 3
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="📋" & Char(10) & "List"
            FontColor: =ColorTextGray
            FontSize: =FsCaption
            Fill: =ColorCard
            BorderThickness: =0
            OnSelect: =Navigate(ListScreen, ScreenTransition.Fade)

      - btnNavProfile:
          Control: Button
          Properties:
            X: =(Parent.Width / 3) * 2
            Y: =Parent.Height - NavBarH
            Width: =Parent.Width / 3
            Height: =NavBarH
            Text: ="👤" & Char(10) & "Profile"
            FontColor: =ColorPrimary
            FontSize: =FsCaption
            FontWeight: =FontWeight.Semibold
            Fill: =ColorCard
            BorderThickness: =0
