App:
  Properties:
    StartScreen: =HomeScreen
    OnStart: |-
      =Set(varCurrentUser, User());
      Set(varAppLoaded, true);
      Set(varAppReady, true)
    Formulas: |-
      =AppVersion = "v1.0.0 · __BUILD_DATE__";

      // ── Color Palette ───────────────────────────────────────────────
      ColorPrimary       = RGBA(99, 91, 255, 1);
      ColorPrimaryMid    = RGBA(130, 120, 255, 1);
      ColorPrimaryBg     = RGBA(220, 215, 255, 0.35);
      ColorBg            = RGBA(238, 238, 252, 1);
      ColorCard          = RGBA(255, 255, 255, 1);
      ColorTextDark      = RGBA(28, 24, 72, 1);
      ColorTextMid       = RGBA(90, 84, 140, 1);
      ColorTextGray      = RGBA(148, 142, 190, 1);
      ColorBorder        = RGBA(224, 222, 240, 1);
      ColorError         = RGBA(220, 50, 50, 1);
      ColorWarning       = RGBA(245, 158, 11, 1);
      ColorSuccess       = RGBA(40, 185, 100, 1);

      // ── Spacing ─────────────────────────────────────────────────────
      SpXSmall  = 4;
      SpSmall   = 8;
      SpMedium  = 16;
      SpLarge   = 24;
      SpXLarge  = 32;

      // ── Typography ──────────────────────────────────────────────────
      FsCaption  = 11;
      FsBody     = 14;
      FsSubtitle = 16;
      FsTitle    = 22;
      FsHeadline = 28;

      // ── Sizing ──────────────────────────────────────────────────────
      AppWidth   = 390;
      AppHeight  = 844;
      NavBarH    = 65;
      HeaderH    = 80;
      ContentY   = HeaderH;
      ContentH   = AppHeight - HeaderH - NavBarH;

      // ── Helpers ─────────────────────────────────────────────────────
      FmtDate(d: DateTime): Text   = Text(d, "dd MMM yyyy");
      FmtTime(d: DateTime): Text   = Text(d, "HH:mm");
      FmtDateTime(d: DateTime): Text = Text(d, "dd MMM yyyy · HH:mm")
