name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build .NET release artifacts
        run: |
          if [ -d "src" ]; then
            for csproj in $(find src -name "*.csproj"); do
              echo "Publishing $csproj"
              dotnet publish "$csproj" -c Release -o "artifacts/$(basename $csproj .csproj)"
            done
          fi

      - name: Package Power Platform solutions
        run: |
          if [ -d "solutions" ]; then
            mkdir -p artifacts/solutions
            cp -r solutions/* artifacts/solutions/ 2>/dev/null || true
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.version }}
          path: artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/**/*
